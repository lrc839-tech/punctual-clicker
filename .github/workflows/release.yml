name: Build and publish macOS package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.7.0)
        required: true
        default: 0.7.0
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - Sources/**
      - Tests/**
      - scripts/**
      - Calibration/**
      - build.sh
      - run-tests.sh

permissions:
  contents: write

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version || '0.7.0' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run protocol and NTP regression tests
        # The real-time scheduler benchmark belongs on a controlled local Mac.
        # Shared hosted runners can be descheduled beyond the tool's late-stop
        # threshold; that is not an input-delivery accuracy acceptance test.
        run: |
          mkdir -p .build
          xcrun swiftc -O -swift-version 5 -parse-as-library Sources/TargetVisibility.swift Tests/TargetVisibilityTests.swift -framework ApplicationServices -o .build/TargetVisibilityTests
          .build/TargetVisibilityTests
          xcrun swiftc -O -swift-version 5 -parse-as-library Sources/CalibrationServer.swift Tests/CalibrationServerTests.swift -framework Network -o .build/CalibrationServerTests
          .build/CalibrationServerTests
          xcrun swiftc -O -swift-version 5 -parse-as-library Sources/TimingEngine.swift Sources/NetworkTime.swift Tests/NetworkTimeTests.swift -framework ApplicationServices -o .build/NetworkTimeTests
          .build/NetworkTimeTests
          xcrun swiftc -O -swift-version 5 -parse-as-library Sources/TimingEngine.swift Sources/HoldClickEngine.swift Tests/HoldClickEngineTests.swift -framework ApplicationServices -o .build/HoldClickEngineTests
          .build/HoldClickEngineTests
          xcrun swiftc -O -swift-version 5 -parse-as-library Sources/DamaiRegionProfile.swift Tests/DamaiRegionProfileTests.swift -framework ApplicationServices -o .build/DamaiRegionProfileTests
          .build/DamaiRegionProfileTests
          xcrun swiftc -O -swift-version 5 -parse-as-library Sources/DamaiRegionProfile.swift Sources/TargetVisibility.swift Sources/WindowRelativeClickTarget.swift Tests/WindowRelativeClickTargetTests.swift -framework ApplicationServices -o .build/WindowRelativeClickTargetTests
          .build/WindowRelativeClickTargetTests
          xcrun swiftc -O -swift-version 5 -parse-as-library Sources/TimingEngine.swift Sources/HoldClickEngine.swift Sources/ImmediateClickStart.swift Tests/ImmediateClickStartTests.swift -framework ApplicationServices -o .build/ImmediateClickStartTests
          .build/ImmediateClickStartTests
          xcrun swiftc -O -swift-version 5 -parse-as-library Sources/BusinessReceiptReview.swift Tests/BusinessReceiptReviewTests.swift -framework AppKit -o .build/BusinessReceiptReviewTests
          .build/BusinessReceiptReviewTests
          node Tests/PhoneCalibrationPageTests.js
          for test_name in DamaiPlanTests DamaiRunPolicyTests; do
            xcrun swiftc -O -swift-version 5 -parse-as-library Sources/DamaiPlan.swift Sources/DamaiRunPolicy.swift "Tests/$test_name.swift" -framework ApplicationServices -o ".build/$test_name"
            ".build/$test_name"
          done
          python3 -m unittest discover -s Calibration -p test_server.py -v
      - name: Build standalone Universal packages
        run: ./scripts/package-release.sh
      - name: Verify bundled resources and native HTTP service
        run: |
          PATH=/usr/bin:/bin:/usr/sbin:/sbin build/准点点击器.app/Contents/MacOS/PunctualClicker --distribution-self-test
          (cd dist && shasum -a 256 -c SHA256SUMS)
      - name: Publish downloadable release
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          下载下方 Assets 中的 **DMG（推荐）或 ZIP**，打开后将「准点点击器」拖到「应用程序」。不需要 AI、Python、Node.js、Xcode 或额外运行环境。Source code 是源码，不是安装包。

          大麦方案改为三键直接控制：框选 1 底部购买、2 努力刷新、3 继续尝试。透明数字与边框显示键位，当前执行区高亮；默认点 1，按住 2／3 接管，松开当前键返回 1。三个区域互斥，无排队或补发。

          各区域独立频率。底部次数 0 为持续，填具体次数则每轮到数暂停；按 1 或松开临时键返回底部重新计数。提供立即启动、NTP 整分直接首击、首击补偿、运行时长上限及三区测试台。此模式不截图、不做页面识别；支付、验证、缺票等页面须由使用者按 Esc 停止并手动处理。

          大麦三区使用镜像窗口内相对坐标，平移自动跟随；明显缩放后重新框选。可重新框选并自动保存，退出重开后恢复。测试台不覆盖手机坐标。

          新增 NTP 手机到点单击校验，显示计划、Mac 实际发出、手机测试页实际收到三个北京时间和校时不确定度；点击瞬间记录、随后回传，不把报告上传等待算入延迟。可选 15 秒后或所设整分；不会自动把单次结果采用为补偿。

          新增手工挂单回执复盘，严格区分 .040 与 .400。手机测试页结果不代表券商受理耗时；复盘不会自动挂单或改变补偿。

          默认区域 2 为镜像窗口内 x=123、y=499、宽84、高16（内部保留原始小数），参考窗口326×719点。旧完整坐标自动迁移为窗口内坐标，其他自定义选区保留。

          新增独立“立即启动等待”：3000 毫秒为按钮后等待 3 秒，也用于三区测试台；倒计时中可切区或 Esc 取消。“整分首击提前”保持独立，不叠加测试等待。

          保留单区、双区、NTP 北京时间、整分定时、延迟补偿、Esc 停止，以及自动分配端口的原生手机校准服务。

          **首次打开：** 当前为 ad-hoc 签名，未使用 Developer ID 签名或 Apple 公证。首次下载后，macOS 可能要求使用者在「系统设置 → 隐私与安全性」确认仍要打开，并亲自开启辅助功能权限。三键模式不需要屏幕录制，键盘拦截以系统实际授权为准。详见仓库 docs/INSTALL.md。

          本版在 GitHub 的 macOS Intel runner 从源码构建 Universal App，运行回归测试及无外部运行时的内置资源／HTTP 自检；Apple Silicon 已在开发机运行验证。真实全新 Mac 的安装和 Gatekeeper 流程仍需由接收者完成。软件不保证 ±1 毫秒或任何第三方业务结果。

          SHA256SUMS 用于核对安装包，release-manifest.json 记录架构和签名／公证状态。
          NOTES
          printf '\nSource commit: `%s`\n' "$GITHUB_SHA" >> release-notes.md
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published assets.' >&2
            exit 1
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" \
            --title "准点点击器 $VERSION · 独立安装包" --notes-file release-notes.md \
            dist/*.dmg dist/*.zip dist/SHA256SUMS dist/release-manifest.json
